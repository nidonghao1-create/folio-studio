name: Feature request
description: Explain a creator or visitor problem that Folio Studio could solve.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the person, situation, and current friction.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired experience
      description: Give a concrete before-and-after example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: How would you like to help?
      options:
        - label: Test a proposed design
        - label: Contribute implementation
        - label: Contribute documentation or examples
